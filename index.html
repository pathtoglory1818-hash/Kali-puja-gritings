<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Diwali Message</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-dark-start: #1a0b2e;
        --bg-dark-end: #0d122b;
        --neon-magenta: #ff00ff;
        --neon-cyan: #00ffff;
        --neon-gold: #ffd700;
        --neon-green: #39ff14;
        --whatsapp-green: #25D366;
        --text-light: #f0f0f0;
    }
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Poppins', 'Google Sans', sans-serif;
        background-color: var(--bg-dark-start);
        color: var(--text-light);
    }

    /* Sticky Ad Slot */
    #ad-slot {
        width: 468px;
        height: 60px;
        margin: 0 auto;
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        z-index: 200;
        text-align: center;
        background-color: #111;
        overflow: hidden;
    }

    .screen {
        position: fixed;
        top: 60px; /* below ad */
        left: 0;
        width: 100%;
        height: calc(100% - 60px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        transition: opacity 1.5s ease-in-out;
    }
    #landing-screen {
        background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
        background-size: 400% 400%;
        animation: gradient-shift 15s ease infinite;
        z-index: 100;
    }
    #landing-screen h1 {
        font-size: clamp(2.5rem, 8vw, 5rem);
        color: white;
        text-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        animation: zoom-in-out 5s ease-in-out infinite;
        max-width: 90%;
    }
    .reveal-button {
        margin-top: 30px;
        padding: 15px 30px;
        font-size: clamp(1rem, 4vw, 1.5rem);
        font-weight: 600;
        color: white;
        background-color: transparent;
        border: 2px solid white;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-cyan) inset;
        animation: neon-glow-pulse 2s infinite;
    }
    .reveal-button:hover {
        background-color: var(--neon-cyan);
        color: var(--bg-dark-end);
        box-shadow: 0 0 25px var(--neon-cyan), 0 0 50px var(--neon-cyan);
    }
    #celebration-screen {
        background: linear-gradient(135deg, var(--bg-dark-start), var(--bg-dark-end));
        opacity: 0;
        visibility: hidden;
        z-index: 50;
        justify-content: flex-start;
        padding-top: 2vh;
        gap: 1vh;
        box-sizing: border-box;
        overflow-y: auto;
        padding-bottom: 3vh;
    }
    #celebration-screen.visible {
        opacity: 1;
        visibility: visible;
    }
    #celebration-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 51;
        pointer-events: none;
    }
    .content-wrapper {
        position: relative;
        z-index: 52;
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .header-text-container {
        position: relative;
        padding: 5px 20px;
        margin-bottom: 10px;
    }
    #header-text {
        font-size: clamp(2rem, 8vw, 4rem);
        font-weight: 700;
        animation: disco-text 4s linear infinite, blink-soft 2s ease-in-out infinite;
    }
    #rakhi-image {
        width: 150px; /* passport size */
        height: 200px;
        border-radius: 10px;
        margin: 15px 0;
    }
    .greeting-container {
        margin-top: 2vh;
        padding: 15px;
        width: 90%;
        max-width: 500px;
        background-color: rgba(0,0,0,0.3);
        border-radius: 15px;
        position: relative;
    }
    #sender-name {
        font-weight: 700;
    }
    .controls-container {
        margin-top: 2vh;
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 90%;
        max-width: 400px;
    }
    .input-field {
        width: 100%;
        padding: 12px;
        background-color: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--neon-cyan);
        border-radius: 10px;
        color: var(--text-light);
        font-size: 1rem;
    }
    .buttons-row {
        display: flex;
        gap: 10px;
        justify-content: center;
        width: 100%;
        margin-top: 1vh;
    }
    .action-button {
        flex: 1;
        padding: 12px;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    .gift-button {
        background: linear-gradient(45deg, var(--neon-gold), #ff8c00);
        color: #333;
    }
    .whatsapp-button {
        background-color: var(--whatsapp-green);
        color: white;
    }
    @keyframes gradient-shift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    @keyframes zoom-in-out {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }
    @keyframes neon-glow-pulse {
        0%, 100% { box-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-cyan) inset; }
        50% { box-shadow: 0 0 25px var(--neon-cyan), 0 0 40px var(--neon-cyan) inset; }
    }
    @keyframes disco-text {
        0% { color: var(--neon-magenta); }
        25% { color: var(--neon-cyan); }
        50% { color: var(--neon-gold); }
        75% { color: var(--neon-green); }
        100% { color: var(--neon-magenta); }
    }
    @keyframes blink-soft {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.8; }
    }
</style>
</head>
<body>

<!-- ===== Sticky Ad Slot ===== -->
<div id="ad-slot">
<script type="text/javascript">
    atOptions = {
        'key' : '3304d41eb713362a2f1d5b0060fbb907',
        'format' : 'iframe',
        'height' : 60,
        'width' : 468,
        'params' : {}
    };
</script>
<script type="text/javascript" src="//www.highperformanceformat.com/3304d41eb713362a2f1d5b0060fbb907/invoke.js"></script>
</div>

<!-- ===== Landing Screen ===== -->
<div id="landing-screen" class="screen">
    <h1>Special Diwali Message Waiting For You</h1>
    <button id="reveal-btn" class="reveal-button">Click to Reveal</button>
</div>

<!-- ===== Celebration Screen ===== -->
<div id="celebration-screen" class="screen">
    <audio id="bg-music" loop src="rakhi.mp3"></audio>
    <canvas id="celebration-canvas"></canvas>

    <div class="content-wrapper">
        <div class="header-text-container">
            <h2 id="header-text">Happy Diwali</h2>
        </div>
        <img id="rakhi-image" src="rakhi.gif" alt="Animated Rakhi">
        <div class="greeting-container">
            <p><span id="sender-name">Someone</span> এর দিক থেকে: <span id="custom-message">আপনাকে কালী পুজোর অনেক অনেক শুভেচ্ছা</span></p>
        </div>
        <div class="controls-container">
            <input type="text" id="name-input" class="input-field" placeholder="Enter your name">
            <textarea id="msg-input" class="input-field" placeholder="Type your message"></textarea>
            <div class="buttons-row">
                <a href="YOUR_AFFILIATE_LINK" target="_blank" class="action-button gift-button">🎁 Special Gifts 👇</a>
                <a href="#" id="whatsapp-share-btn" class="action-button whatsapp-button">Share on WhatsApp</a>
            </div>
        </div>
    </div>
</div>

<script>
const revealBtn = document.getElementById('reveal-btn');
const landingScreen = document.getElementById('landing-screen');
const celebrationScreen = document.getElementById('celebration-screen');
const bgMusic = document.getElementById('bg-music');
const nameInput = document.getElementById('name-input');
const msgInput = document.getElementById('msg-input');
const senderName = document.getElementById('sender-name');
const customMsg = document.getElementById('custom-message');
const whatsappBtn = document.getElementById('whatsapp-share-btn');

revealBtn.addEventListener('click', () => {
    landingScreen.style.display = 'none';
    celebrationScreen.classList.add('visible');
    if(bgMusic) bgMusic.play();
    startFireworks();
});

nameInput.addEventListener('input', () => {
    senderName.textContent = nameInput.value || 'Someone';
});

msgInput.addEventListener('input', () => {
    customMsg.textContent = msgInput.value || 'আপনাকে কালী পুজোর অনেক অনেক শুভেচ্ছা';
});

whatsappBtn.addEventListener('click', () => {
    const msg = `Happy Diwali! ${senderName.textContent} এর বার্তা: ${customMsg.textContent}`;
    const url = encodeURIComponent(window.location.href);
    const whatsappURL = `https://wa.me/?text=${encodeURIComponent(msg + ' ' + url)}`;
    window.open(whatsappURL, '_blank');
});

// Simple fireworks effect
function startFireworks() {
    const canvas = document.getElementById('celebration-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const particles = [];

    function createFirework() {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height / 2;
        const count = 30 + Math.random() * 30;
        for(let i=0;i<count;i++){
            particles.push({
                x, y,
                dx: (Math.random()-0.5)*5,
                dy: (Math.random()-0.5)*5,
                alpha: 1,
                color: `hsl(${Math.random()*360},100%,50%)`
            });
        }
    }

    function animate() {
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        for(let i=particles.length-1;i>=0;i--){
            const p = particles[i];
            p.x+=p.dx; p.y+=p.dy; p.alpha-=0.01;
            ctx.fillStyle = p.color;
            ctx.globalAlpha=p.alpha;
            ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
            ctx.globalAlpha=1;
            if(p.alpha<=0) particles.splice(i,1);
        }
        requestAnimationFrame(animate);
    }
    setInterval(createFirework,800);
    animate();
}

window.addEventListener('resize', () => {
    const canvas = document.getElementById('celebration-canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
